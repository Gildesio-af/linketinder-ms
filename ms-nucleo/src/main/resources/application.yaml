spring:
  application:
    name: ms-nucleo

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ms_nucleo_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

api:
  security:
    token:
      secret: ${APP_JWT_SECRET:default-dev-secret-key-at-least-32-chars}
      expiration_in_hours: ${APP_JWT_EXPIRATION_TIME_IN_HOURS:24}