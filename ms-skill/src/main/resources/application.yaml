  spring:
    application:
      name: ms-skill
    datasource:
      url: jdbc:postgresql://localhost:5435/ms_skill_db
      username: ${SPRING_DATASOURCE_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_PASSWORD:123456}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true