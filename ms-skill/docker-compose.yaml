services:
  ms-skill-api:
    container_name: ms-skill-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8082:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://skill-db:5432/ms_skill_db
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      skill-db:
        condition: service_healthy
    networks:
      - skill-network

  skill-db:
    container_name: ms_skill_db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ms_skill_db
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - '5435:5432'
    volumes:
      - skill_postgres_data:/var/lib/postgresql/data
    networks:
      - skill-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d ms_skill_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  skill_postgres_data:

networks:
  skill-network:
    driver: bridge